<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sian</title>
    <b:skin><![CDATA[
      @import url(https://fonts.googleapis.com/css?family=Poppins:400,500,600,700&display=swap);
      :root {
      --primary-color: #007bff;
      --secondary-color: #6c757d;
      --background-color: #f8f9fa;
      --text-color: #212529;
      --font-family: 'Poppins', sans-serif;
      }
      body {
          font-family: var(--font-family);
          color: var(--text-color);
          background-color: var(--background-color);
      }
      .container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 0 15px;
      }
      #header-wrap {
          background-color: #fff;
          box-shadow: 0 2px 5px rgba(0,0,0,0.1);
          position: sticky;
          top: 0;
          z-index: 1000;
      }
      .header-bar {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 15px 0;
      }
      .header-logo img {
          max-height: 40px;
      }
      .sf-menu {
          list-style: none;
          margin: 0;
          padding: 0;
          display: flex;
      }
      .sf-menu li {
          margin-left: 20px;
      }
      .sf-menu a {
          color: var(--text-color);
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
      }
      .sf-menu a:hover {
          color: var(--primary-color);
      }
      #main-wrapper {
          padding: 30px 0;
      }
      .main-content {
          width: 70%;
          float: left;
      }
      .sidebar {
          width: 30%;
          float: right;
          padding-left: 30px;
      }
    ]]></b:skin>
</head>
<body>
    <div id="header-wrap">
        <div class="header-bar">
            <div class="container">
                <div class="header-logo">
                    <a href="https://sian-soratemplates.blogspot.com/"><img src="https://blogger.googleusercontent.com/img/a/AVvXsEgtIHaT2vCnSi49OOfGMGROlnmotuZ285fpS1HTuE_RMN1LRu-gYlvS7vzJ9hl2N2sFHaEaAcWwfAxdnngxZXpBWy8cCjqCMgEDFBMFxjjiuIlaG18Vrr6Zg8BJxfnIyHQyvoVahQ-78CTftJIuRkOj_smeC9cdfK9yAJvmFk1Dupna6urkxDUg0MRJMJa7=s102" alt="Sian"></a>
                </div>
                <div class="header-menu">
                    <ul class="sf-menu">
                        <li><a href="https://sian-soratemplates.blogspot.com/#header-wrap">Home</a></li>
                        <li><a href="https://sian-soratemplates.blogspot.com/#serv-tile-wrap">Services</a></li>
                        <li><a href="https://sian-soratemplates.blogspot.com/#counter-image-nav">Conuter</a></li>
                        <li><a href="https://sian-soratemplates.blogspot.com/#intro-author-wrap">Information</a></li>
                        <li><a href="https://sian-soratemplates.blogspot.com/#head-text2">Projects</a></li>
                        <li><a href="https://sian-soratemplates.blogspot.com/#testimonial-wrap">Reviews</a></li>
                        <li><a href="https://sian-soratemplates.blogspot.com/#main-wrapper">Blog</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div id="main-wrapper">
        <div class="container">
            <div class="main-content">
                <b:section class='main' id='main' showaddelement='yes'>
                  <b:widget id='Blog1' locked='true' title='Blog Posts' type='Blog' version='1'>
                    <b:includable id='main' var='top'>
                      <!-- posts -->
                      <div class='blog-posts hfeed'>
                        <b:include data='top' name='status-message'/>
                        <b:loop values='data:posts' var='post'>
                          <b:include data='post' name='post'/>
                        </b:loop>
                      </div>
                    </b:includable>
                  </b:widget>
                </b:section>
            </div>
            <div class="sidebar">
                <b:section class='sidebar' id='sidebar' showaddelement='yes'>
                  <b:widget id='ContactForm1' locked='false' title='Contact Form' type='ContactForm' version='1'>
                  </b:widget>
                </b:section>
            </div>
        </div>
    </div>
    <script src="https://sian-soratemplates.blogspot.com/main.js"></script>
    <script>
        // Smooth scroll for anchor links
        $(document).on('click', 'a[href^="#"]', function (event) {
            event.preventDefault();
            $('html, body').animate({
                scrollTop: $($.attr(this, 'href')).offset().top
            }, 500);
        });
    </script>
</body>
</html>
